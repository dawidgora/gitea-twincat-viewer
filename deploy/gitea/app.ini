; Local development app.ini for Gitea.
;
; Includes the external renderer fragment from app.ini.d/twincat.ini.
; Gitea automatically picks up everything in app.ini.d on start.

[server]
DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
SSH_DOMAIN = localhost
SSH_PORT = 22
DISABLE_SSH = false
LFS_START_SERVER = true

[database]
PATH = /data/gitea/db.sqlite
DB_TYPE = sqlite3

[security]
INSTALL_LOCK = true
SECRET_KEY = devsecretkey-replace-in-prod-do-not-use-in-prod-1234567890

[service]
DISABLE_REGISTRATION = false
ENABLE_NOTIFY_MAIL = false

[webui]
THEME = gitea-auto

[markup.twincat]
ENABLED = true
FILE_EXTENSIONS = .TcPOU,.TcDUT,.TcGVL
RENDER_COMMAND = /usr/local/bin/gitea-twincat-viewer
IS_INPUT_FILE = true
RENDER_CONTENT_MODE = no-sanitizer
