; Gitea external renderer configuration for TwinCAT files.
;
; This file is mounted into Gitea's data volume at
; /data/gitea/conf/app.ini.d/twincat.ini. Gitea automatically merges
; every *.ini file inside conf/app.ini.d/ into the main app.ini on
; start-up, so this is the cleanest way to ship renderer config
; without forking Gitea's image.
;
; The RENDER_COMMAND path is where the viewer binary lives after the
; initContainer copies it into the shared emptyDir volume.

[markup.twincat]
ENABLED = true
FILE_EXTENSIONS = .TcPOU,.TcDUT,.TcGVL
RENDER_COMMAND = /opt/gitea-extensions/gitea-twincat-viewer
IS_INPUT_FILE = true
; The renderer emits only escaped text and safe structural HTML, so we can
; bypass bluemonday and keep our inline styles, layout classes and <style> block.
RENDER_CONTENT_MODE = no-sanitizer
